services:
  # ==========================================
  # Database: MongoDB Community Server
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: hms-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: hercs_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hms-network

  # ==========================================
  # Backend API & WebSocket Service
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hms-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/hercs_db}
      JWT_SECRET: ${JWT_SECRET:-mayo-hercs-secure-jwt-secret-2026}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-mayo-hmis-secure-api-key-2026}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hms-network

  # ==========================================
  # Frontend Web Client (React + Vite + Nginx)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hms-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - hms-network

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  mongo_data:
    name: hms_mongo_data

# ==========================================
# Network Bridge
# ==========================================
networks:
  hms-network:
    name: hms_network
    driver: bridge
