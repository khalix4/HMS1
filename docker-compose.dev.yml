services:
  mongodb:
    image: mongo:7.0
    container_name: hms-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hercs_db
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - hms-dev-network

  server:
    image: node:20-alpine
    container_name: hms-server-dev
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/hercs_db
      JWT_SECRET: mayo-hercs-secure-jwt-secret-2026
      INTEGRATION_API_KEY: mayo-hmis-secure-api-key-2026
    depends_on:
      - mongodb
    command: sh -c "npm install && npm run dev"
    networks:
      - hms-dev-network

  client:
    image: node:20-alpine
    container_name: hms-client-dev
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - hms-dev-network

volumes:
  mongo_data_dev:

networks:
  hms-dev-network:
    driver: bridge
